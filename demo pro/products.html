<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Super Bright Labs — Products</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --black: #111827;
    --white: #ffffff;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #6b7280;
    --gray-600: #4b5563;
    --gray-800: #1f2937;
    --accent: #e60023;
    --border: 1px solid #e5e7eb;
    --border-dark: 1px solid #d1d5db;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #eff2f7;
    color: var(--black);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP NAV ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 64px;
    background: #ffffff;
    color: var(--black);
    flex-shrink: 0;
    border-bottom: 1px solid #e5e7eb;
  }
  .logo {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .logo span { color: #e60023; font-weight: 800; }
  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #374151;
    text-decoration: none;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: #e60023; }
  .nav-badge {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: var(--gray-400);
    letter-spacing: 0.08em;
  }

  /* ── BREADCRUMB BAR ── */
  .breadbar {
    background: var(--white);
    border-bottom: var(--border);
    padding: 10px 32px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--gray-400);
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .breadbar span { color: var(--black); }

  /* ── MAIN LAYOUT ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── LEFT SIDEBAR ── */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    border-right: var(--border);
    overflow-y: auto;
    background: var(--white);
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--gray-200); }

  .sidebar-header {
    padding: 20px 24px 12px;
    border-bottom: var(--border);
    background: var(--gray-100);
  }
  .sidebar-header h3 {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray-400);
  }

  .category-block { border-bottom: var(--border); }

  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    cursor: pointer;
    background: var(--white);
    transition: background 0.15s;
    user-select: none;
  }
  .cat-header:hover { background: var(--gray-100); }
  .cat-header.open { background: var(--accent); color: #ffffff; }
  .cat-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .cat-count {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    opacity: 0.5;
  }
  .cat-chevron {
    font-size: 10px;
    transition: transform 0.2s;
    opacity: 0.5;
  }
  .cat-header.open .cat-chevron { transform: rotate(180deg); opacity: 1; color: #ffffff; }

  .cat-body { display: none; }
  .cat-body.open { display: block; }

  .subcat-block { border-bottom: 1px solid var(--gray-100); }
  .subcat-header {
    padding: 10px 24px 10px 28px;
    cursor: pointer;
    background: #f9fafb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
  }
  .subcat-header:hover { background: var(--gray-200); }
  .subcat-title {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--gray-600);
    text-transform: uppercase;
  }
  .subcat-chevron { font-size: 9px; color: var(--gray-400); transition: transform 0.2s; }
  .subcat-header.open .subcat-chevron { transform: rotate(180deg); }
  .subcat-header.open .subcat-title { color: var(--black); }

  .product-list { display: none; padding: 4px 0; background: #f3f4f6; }
  .product-list.open { display: block; }

  .product-item {
    padding: 9px 24px 9px 36px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--gray-600);
    border-left: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .product-item:hover { color: var(--black); background: var(--gray-100); border-left-color: var(--gray-400); }
  .product-item.active { color: var(--black); background: var(--white); border-left-color: var(--black); font-weight: 500; }
  .product-item::before { content: '—'; font-size: 10px; color: var(--gray-400); flex-shrink: 0; }

  /* ── PRODUCT PANEL ── */
  .product-panel {
    flex: 1;
    overflow-y: auto;
    background: var(--white);
    padding: 40px 52px;
  }
  .product-panel::-webkit-scrollbar { width: 5px; }
  .product-panel::-webkit-scrollbar-thumb { background: var(--gray-200); }

  .product-panel.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .empty-icon {
    font-size: 64px;
    opacity: 0.08;
  }
  .empty-text {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--gray-400);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Product detail */
  .prod-meta {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .prod-sku {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--gray-400);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .prod-name {
    font-family: 'Inter', sans-serif;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.05;
    color: var(--black);
    max-width: 500px;
  }
  .prod-tag {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--gray-600);
    margin-top: 10px;
    letter-spacing: 0.04em;
    border-left: 2px solid var(--gray-200);
    padding-left: 10px;
  }
  .prod-badge {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    background: var(--accent);
    color: #ffffff;
    padding: 5px 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Product image */
  .prod-visual-row {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 32px;
    margin-bottom: 40px;
  }
  .prod-image-box {
    background: var(--gray-100);
    border: var(--border);
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .prod-image-box img { max-width: 85%; max-height: 85%; object-fit: contain; }
  .img-watermark {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    color: var(--gray-400);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Specs panel */
  .specs-box {
    border: var(--border-dark);
    padding: 24px;
  }
  .specs-title {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: var(--border);
  }
  .spec-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 12.5px;
  }
  .spec-row:last-child { border-bottom: none; }
  .spec-key {
    font-family: 'Inter', sans-serif;
    color: var(--gray-400);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .spec-val { font-weight: 500; font-size: 13px; }

  /* Description */
  .prod-desc {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.75;
    color: var(--gray-600);
    margin-bottom: 40px;
    max-width: 680px;
  }

  /* Section headings */
  .section-heading {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--black);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-heading .sh-num {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--gray-400);
    font-weight: 300;
  }

  /* Consumables grid */
  .consumables-section { margin-bottom: 48px; }
  .consumables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .consumable-card {
    border: var(--border);
    padding: 18px 16px;
    background: var(--white);
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
  }
  .consumable-card:hover { border-color: var(--black); background: var(--gray-100); }
  .con-icon {
    width: 44px;
    height: 44px;
    background: var(--accent);
    margin-bottom: 14px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .con-icon svg { width: 24px; height: 24px; stroke: var(--white); fill: none; stroke-width: 1.5; }
  .con-name {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .con-sku {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: var(--gray-400);
    letter-spacing: 0.06em;
  }
  .con-price {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-top: 10px;
    color: var(--black);
  }

  /* Similar products */
  .similar-section { margin-bottom: 48px; }
  .similar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .similar-card {
    border: var(--border);
    cursor: pointer;
    transition: border-color 0.2s;
    overflow: hidden;
  }
  .similar-card:hover { border-color: var(--black); }
  .sim-image {
    background: var(--gray-100);
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: var(--border);
  }
  .sim-image img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .sim-info { padding: 14px 16px; }
  .sim-sku {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    color: var(--gray-400);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .sim-name {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }
  .sim-tag {
    font-size: 11px;
    color: var(--gray-600);
    margin-top: 4px;
    font-family: 'Inter', sans-serif;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 2px; }

  /* Divider */
  hr.prod-divider { border: none; border-top: var(--border); margin: 36px 0; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .product-panel > * { animation: fadeIn 0.3s ease forwards; }
</style>
</head>

      <text x="60" y="44" text-anchor="middle" font-family="Inter" font-size="9" fill="#f5f5f0">12.45m</text>
      <circle cx="120" cy="40" r="8" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
      <line x1="120" y1="32" x2="120" y2="48" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="112" y1="40" x2="128" y2="40" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="140" y1="25" x2="148" y2="20" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
    </svg>`,
    "bubble": `<svg viewBox="0 0 180 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      ${Array.from({length:4}, (_,r) => Array.from({length:6}, (_,c) =>
        `<circle cx="${22 + c*28 + (r%2)*14}" cy="${22 + r*24}" r="10" stroke="#0a0a0a" stroke-width="1.5" fill="#e8e8e4"/>`

      ${Array.from({length:6}, (_,r) => Array.from({length:8}, (_,c) =>

    "roll": `<svg viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="70" cy="110" rx="55" ry="10" stroke="#0a0a0a" stroke-width="2" fill="#d0d0ca"/>
      <rect x="15" y="20" width="110" height="90" rx="55" stroke="#0a0a0a" stroke-width="2.5" fill="#e8e8e4"/>
      <ellipse cx="70" cy="20" rx="55" ry="10" stroke="#0a0a0a" stroke-width="2" fill="#d0d0ca"/>
      <ellipse cx="70" cy="20" rx="22" ry="5" stroke="#0a0a0a" stroke-width="1.5" fill="#f5f5f0"/>
      <text x="70" y="65" text-anchor="middle" font-family="Inter" font-size="8" fill="#555550">STRETCH</text>
      <text x="70" y="76" text-anchor="middle" font-family="Inter" font-size="8" fill="#555550">FILM</text>
    </svg>`,
    "edge": `<svg viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 100 L20 20 L70 20 L70 40 L40 40 L40 100 Z" stroke="#0a0a0a" stroke-width="2.5" fill="#e8e8e4"/>
      <path d="M40 40 L70 20" stroke="#0a0a0a" stroke-width="1.5"/>
      <path d="M40 60 L65 44" stroke="#999990" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M40 75 L65 59" stroke="#999990" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M40 90 L65 74" stroke="#999990" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="25" y="115" font-family="Inter" font-size="7" fill="#555550">CORNERBOARD</text>
    </svg>`,
  };
  return svgs[type] || svgs["tape-roll"];
}

function getConsumableIcon(type) {
  const icons = {
    dispenser: `<polyline points="8,20 8,4 16,4 16,20"/><line x1="4" y1="20" x2="20" y2="20"/><path d="M8 12 Q4 12 4 16 Q4 20 8 20"/>`,
    spray: `<path d="M5 4h8v4H5z"/><path d="M13 6h4v12H9V9"/><circle cx="11" cy="15" r="2"/><line x1="13" y1="3" x2="17" y2="3"/>`,
    roller: `<rect x="3" y="8" width="18" height="8" rx="4"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>`,
    bottle: `<path d="M9 2h6v4l2 3v12H7V9l2-3z"/><line x1="7" y1="14" x2="17" y2="14"/>`,
    cutter: `<path d="M4 20 L20 4"/><path d="M15 4 L20 4 L20 9"/><circle cx="6" cy="18" r="2"/>`,
    wipe: `<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M8 6V4h8v2"/>`,
    battery: `<rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/>`,
    charger: `<path d="M4 17l4-10 4 10"/><path d="M6.5 13h5"/><path d="M16 7v10"/><line x1="14" y1="10" x2="18" y2="10"/>`,
    "bit-set": `<line x1="12" y1="2" x2="12" y2="22"/><path d="M9 5h6"/><path d="M10 8h4"/><circle cx="12" cy="19" r="2"/>`,
    clip: `<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>`,
    case: `<rect x="2" y="8" width="20" height="14" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>`,
    disc: `<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>`,
    shield: `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>`,
    blade: `<path d="M4 20 L20 4 L16 4 L4 16 Z"/><line x1="18" y1="6" x2="22" y2="2"/>`,
    vacuum: `<circle cx="12" cy="12" r="8"/><path d="M12 8v8"/><path d="M8 12h8"/>`,
    rail: `<line x1="2" y1="12" x2="22" y2="12"/><line x1="6" y1="7" x2="6" y2="17"/><line x1="18" y1="7" x2="18" y2="17"/>`,
    glove: `<path d="M18 11V6a2 2 0 0 0-4 0v3"/><path d="M14 10V4a2 2 0 0 0-4 0v4"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8c0 3.3 2.7 6 6 6s6-2.7 6-6v-4a2 2 0 0 0-4 0z"/>`,
    scraper: `<rect x="4" y="14" width="16" height="4" rx="1"/><line x1="12" y1="14" x2="12" y2="4"/><line x1="9" y1="7" x2="15" y2="7"/>`,
    brush: `<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 17H20V3H6.5"/><circle cx="10" cy="10" r="1"/>`,
    squeegee: `<rect x="3" y="3" width="18" height="6" rx="1"/><line x1="12" y1="9" x2="12" y2="21"/><line x1="9" y1="18" x2="15" y2="18"/>`,
    tie: `<path d="M8 3h8"/><path d="M12 3v5l4 2-4 2-4-2 4-2"/><path d="M12 12v9"/>`,
    "tape-floor": `<rect x="3" y="10" width="18" height="4" rx="1"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="13" y1="10" x2="13" y2="14"/>`,
    roll: `<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>`,
    screw: `<line x1="12" y1="2" x2="12" y2="16"/><path d="M8 6h8M9 9h6M10 12h4"/><path d="M10 16 L12 22 L14 16"/>`,
    detector: `<rect x="6" y="4" width="12" height="16" rx="2"/><circle cx="12" cy="14" r="3"/><line x1="12" y1="8" x2="12" y2="11"/>`,
    tripod: `<line x1="12" y1="4" x2="12" y2="20"/><line x1="12" y1="12" x2="4" y2="20"/><line x1="12" y1="12" x2="20" y2="20"/>`,
    "tape-measure": `<circle cx="12" cy="12" r="8"/><path d="M12 4v4"/><path d="M12 16v4"/><path d="M4 12h4"/><path d="M16 12h4"/>`,
    strap: `<path d="M3 12h18"/><path d="M3 7h18"/><path d="M3 17h18"/>`,
  };
  return icons[type] || icons.clip;
}

// ── RENDER SIDEBAR ───────────────────────────────────────────
function renderSidebar() {
  const nav = document.getElementById("sidebar-nav");
  nav.innerHTML = CATALOGUE.map(cat => {
    const totalProducts = cat.subcategories.reduce((a, s) => a + s.products.length, 0);
    return `
      <div class="category-block" id="cat-block-${cat.id}">
        <div class="cat-header" onclick="toggleCat('${cat.id}')">
          <div>
            <div class="cat-title">${cat.name}</div>
            <div class="cat-count">${totalProducts} products</div>
          </div>
          <span class="cat-chevron">▼</span>
        </div>
        <div class="cat-body" id="cat-body-${cat.id}">
          ${cat.subcategories.map(sub => `
            <div class="subcat-block">
              <div class="subcat-header" onclick="toggleSubcat('${sub.id}')">
                <span class="subcat-title">${sub.name}</span>
                <span class="subcat-chevron">▼</span>
              </div>
              <div class="product-list" id="sub-${sub.id}">
                ${sub.products.map(p => `
                  <div class="product-item" id="item-${p.id}" onclick="showProduct('${p.id}')">
                    ${p.name}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleCat(catId) {
  const body = document.getElementById(`cat-body-${catId}`);
  const header = document.querySelector(`#cat-block-${catId} .cat-header`);
  const isOpen = body.classList.contains("open");
  // close all
  document.querySelectorAll('.cat-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.cat-header').forEach(h => h.classList.remove('open'));
  if (!isOpen) {
    body.classList.add('open');
    header.classList.add('open');
  }
}

function toggleSubcat(subId) {
  const list = document.getElementById(`sub-${subId}`);
  const header = list.previousElementSibling;
  list.classList.toggle('open');
  header.classList.toggle('open');
}

// ── RENDER PRODUCT ───────────────────────────────────────────
function showProduct(productId) {
  const p = productIndex[productId];
  if (!p) return;

  // sidebar active
  document.querySelectorAll('.product-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`item-${productId}`);
  if (item) item.classList.add('active');

  // breadcrumb
  document.getElementById('breadbar').innerHTML = `Products / ${p.catName} / ${p.subName} / <span>${p.name}</span>`;

  // similar products
  const similarHTML = (p.similar || []).map(sid => {
    const sp = productIndex[sid];
    if (!sp) return '';
    return `
      <div class="similar-card" onclick="showProduct('${sp.id}')"> 
        <div class="sim-image"><img src="${sp.imageUrl}" alt="${sp.name}" loading="lazy"/></div>
        <div class="sim-info">
          <div class="sim-sku">${sp.sku}</div>
          <div class="sim-name">${sp.name}</div>
          <div class="sim-tag">${sp.tagline.substring(0, 50)}…</div>
        </div>
      </div>
    `;
  }).join('');

  // consumables
  const consumablesHTML = p.consumables.map(c => `
    <div class="consumable-card">
      <div class="con-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="${getConsumableIcon(c.icon)}" stroke="white" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="con-name">${c.name}</div>
      <div class="con-sku">${c.sku}</div>
      <div class="con-price">${c.price}</div>
    </div>
  `).join('');

  // specs
  const specsHTML = Object.entries(p.specs).map(([k, v]) => `
    <div class="spec-row">
      <span class="spec-key">${k}</span>
      <span class="spec-val">${v}</span>
    </div>
  `).join('');

  const panel = document.getElementById('product-panel');
  panel.classList.remove('empty');
  panel.innerHTML = `
    <div class="prod-meta">
      <div>
        <div class="prod-sku">${p.sku} · ${p.brand}</div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-tag">${p.tagline}</div>
      </div>
      <div class="prod-badge">${p.badge}</div>
    </div>

    <div class="prod-visual-row">
      <div class="prod-image-box">
        <img src="${p.imageUrl}" alt="${p.name}"/>
        <span class="img-watermark">Super Bright Labs</span>
      </div>
      <div class="specs-box">
        <div class="specs-title">Specifications</div>
        ${specsHTML}
      </div>
    </div>

    <p class="prod-desc">${p.description}</p>

    <hr class="prod-divider"/>

    <div class="consumables-section">
      <div class="section-heading">
        Consumables & Accessories
        <span class="sh-num">${p.consumables.length} items</span>
      </div>
      <div class="consumables-grid">${consumablesHTML}</div>
    </div>

    ${p.similar && p.similar.length > 0 ? `
    <div class="similar-section">
      <div class="section-heading">
        Similar Products
        <span class="sh-num">${p.similar.length} items</span>
      </div>
      <div class="similar-grid">${similarHTML}</div>
    </div>
    ` : ''}
  `;
  panel.scrollTop = 0;
}

// ── INIT ──────────────────────────────────────────────────────
renderSidebar();

// Check URL for product parameter
const urlParams = new URLSearchParams(window.location.search);
const requestedProduct = urlParams.get('product');

if (requestedProduct && productIndex[requestedProduct]) {
  const p = productIndex[requestedProduct];
  // Open the correct category
  CATALOGUE.forEach(cat => {
    cat.subcategories.forEach(sub => {
      sub.products.forEach(prod => {
        if (prod.id === requestedProduct) {
          toggleCat(cat.id);
          toggleSubcat(sub.id);
        }
      });
    });
  });
  showProduct(requestedProduct);
} else {
  // Default: open first category/subcategory/product
  toggleCat(CATALOGUE[0].id);
  const firstSub = CATALOGUE[0].subcategories[0];
  toggleSubcat(firstSub.id);
  showProduct(firstSub.products[0].id);
}
</script>
</body>
</html>
